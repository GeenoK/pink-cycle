<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A1B3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="经期记录">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>经期记录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <!-- 配置缺失或登录组件没加载时显示 -->
  <section id="viewSetup" hidden>
    <h1>经期记录</h1>
    <p class="muted" id="setupMsg"></p>
  </section>

  <!-- 登录 -->
  <section id="viewAuth" hidden>
    <h1>经期记录</h1>
    <p class="muted">登录你的账号，记录只属于你。</p>
    <form id="loginForm" class="card">
      <label for="email">邮箱</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">密码</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn primary wide" id="loginBtn" type="submit">登录</button>
    </form>
  </section>

  <!-- 主界面 -->
  <section id="viewMain" hidden>
    <header>
      <div>
        <h1>经期记录</h1>
        <div class="sync" id="sync" role="status"></div>
      </div>
      <button class="linkbtn" id="moreBtn">更多</button>
    </header>

    <section class="hero">
      <button class="big idle" id="toggle" aria-live="polite"></button>
      <p class="status" id="status"></p>
    </section>

    <section class="stats" aria-label="统计">
      <div class="stat"><b id="sCycle">–</b><span>平均周期（天）</span></div>
      <div class="stat"><b id="sPeriod">–</b><span>平均经期（天）</span></div>
      <div class="stat"><b id="sNext">–</b><span>预计下次开始</span></div>
    </section>
    <p class="note" id="note"></p>

    <div class="listhead">
      <h2>历史记录</h2>
      <button class="linkbtn" id="addBtn">补录一条</button>
    </div>
    <div id="list"></div>
  </section>

</main>

<dialog id="editDlg">
  <h3 id="editTitle">编辑记录</h3>
  <label for="fStart">开始日期</label>
  <input type="date" id="fStart">
  <label for="fEnd">结束日期</label>
  <input type="date" id="fEnd">
  <p class="hint">结束日期留空表示经期还在进行中。</p>
  <p class="err" id="editErr" role="alert"></p>
  <div class="actions">
    <button class="btn danger" id="delBtn">删除</button>
    <button class="btn" id="cancelBtn">取消</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
</dialog>

<dialog id="moreDlg">
  <h3>更多</h3>
  <p class="hint" id="whoami" style="margin:0 0 14px"></p>
  <label for="backupText">备份 / 批量导入</label>
  <p class="hint">下面是全部记录。要导入历史记录，把整段文字替换成你的数据再点“导入”。导入是合并：开始日期相同的记录会被覆盖，其他记录保留。</p>
  <textarea id="backupText" spellcheck="false" aria-label="备份数据"></textarea>
  <p class="err" id="backupErr" role="alert"></p>
  <div class="actions">
    <button class="btn" id="copyBtn">复制</button>
    <button class="btn primary" id="importBtn">导入</button>
  </div>
  <div class="actions" style="margin-top:20px">
    <button class="btn danger" id="logoutBtn">退出登录</button>
    <button class="btn" id="closeMore">关闭</button>
  </div>
</dialog>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undoBtn">撤销</button></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
